name: Release

# 推送 v<语义化版本> 标签时触发：
#   1) 跑测试  2) 校验 tag 与 package.json.version 一致  3) 打包 .vsix
#   4) 建 GitHub Release 并附 .vsix  5) 配了 VSCE_PAT 时同时发布到 Marketplace
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  VSCE_PAT: ${{ secrets.VSCE_PAT }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 语法检查 + 单元测试
        run: npm test

      - name: 校验 tag 与 package.json 版本一致
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 package.json version $VERSION 不一致"
            exit 1
          fi
          echo "版本一致：v$VERSION"

      - name: 打包 .vsix
        run: npx --yes @vscode/vsce package --allow-missing-repository

      - name: 创建 GitHub Release 并上传 .vsix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" ./*.vsix \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      - name: 发布到 VS Code Marketplace（可选，需 VSCE_PAT）
        if: env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce publish --packagePath ./*.vsix
